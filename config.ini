; Prometheus-Momus configuration
; =================================
;
; Users normally edit only:
;   task.md
;   Prometheus.md
;   Momus.md
;
; This file controls orchestration/runtime behavior.

[debate]

; Number of successful adversarial COUNTER rounds required before ACCEPT
; becomes legal.
min_counter_rounds = 3

; Hard ceiling on successful COUNTER rounds.
max_counter_rounds = 8

; If true, Momus performs its first analysis without being shown
; Prometheus's opening response.
blind_second_agent = true

; If true, a tentative ACCEPT triggers one final falsification turn.
final_acceptance_audit = true

; Maximum automatic repair attempts for protocol violations such as
; premature acceptance or ACCEPT + blocking issues.
max_protocol_repairs = 2

; Printed while a long Codex turn is running.
heartbeat_seconds = 60

; 0 means no controller-imposed timeout.
turn_timeout_minutes = 0


[codex]

; Leave blank to inherit the user's Codex configuration.
; Example:
; model = gpt-5.6-sol
model =

; Leave blank to inherit the user's Codex configuration.
; Example values depend on the selected model/CLI version.
; Example:
; reasoning_effort = max
reasoning_effort =

; inherit | disabled | cached | indexed | live
; For literature/news/prior-art tasks, live is usually appropriate.
web_search = inherit

; read-only is strongly recommended for brainstorming/review.
; Other Codex CLI modes may include workspace-write and danger-full-access.
sandbox = read-only

; Allows use in ordinary non-Git project folders.
skip_git_repo_check = true

; Advanced options. Normally leave false.
ignore_user_config = false
ignore_rules = false


[paths]

; Default layout assumes this harness folder is placed directly inside the
; target project, e.g. /project/.codex-debate/debate.py
project_root = ..

task_file = task.md
prometheus_file = Prometheus.md
momus_file = Momus.md
schema_file = schema.json

; Completed and failed runs are self-archived here.
runs_dir = runs


[output]

; Publish the exact controller prompts in each run archive.
publish_prompts = true

; Publish raw Codex JSONL event streams in each run archive.
publish_raw_jsonl = true

; Normally false because every completed run is already archived under runs/.
keep_private_runtime_on_success = false

; Keeping the private /tmp runtime after failure can help debugging.
keep_private_runtime_on_failure = true
