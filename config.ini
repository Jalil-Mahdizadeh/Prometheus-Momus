; ============================================================================
; General-purpose Prometheus-Momus configuration
; ============================================================================

[debate]

; Opening and blind analysis do not count as counter-rounds. Two completed
; counter-rounds give each agent one opportunity to challenge the other.
min_counter_rounds = 2

; End without forced consensus when this ceiling is reached.
max_counter_rounds = 6

; Momus forms an independent position before seeing Prometheus's opening.
blind_second_agent = true

; A tentative ACCEPT triggers one dedicated falsification attempt.
final_acceptance_audit = true

; Automatic repairs for premature ACCEPT, invalid decisions, or inconsistent
; acceptance evidence.
max_protocol_repairs = 2

; Progress interval while a Codex subprocess is active.
heartbeat_seconds = 60

; 0 disables the per-turn timeout. The total wall budget remains mandatory.
turn_timeout_minutes = 0


[codex]

; Blank values inherit the operator's Codex configuration. Pin them only when
; reproducibility requires a specific model or reasoning level.
model =
reasoning_effort =

; inherit, disabled, cached, indexed, or live. Enable live search only when the
; task needs current external information.
web_search = inherit

; Agents inspect the target but cannot modify it by default.
sandbox = read-only

; The target may be a directory that is not a Git repository.
skip_git_repo_check = true

; Preserve the operator's normal Codex configuration and project rules.
ignore_user_config = false
ignore_rules = false


[paths]

; Paths are resolved relative to this file. The safe standalone default is the
; harness directory itself. Set an explicit target or pass --project-root.
; When the harness is embedded directly inside a target, use:
;
;   project_root = ..
project_root = .

task_file = task.md
prometheus_file = Prometheus.md
momus_file = Momus.md
schema_file = schema.json
adjudication_schema_file = adjudication_schema.json

; Terminal runs are archived into unique subdirectories.
runs_dir = runs

; Durable private checkpoints. Agents cannot inspect this directory.
state_dir = .prometheus-momus-state


[isolation]

; Required when blind_second_agent=true. Linux uses bubblewrap. Startup fails
; closed if the enforced blind boundary cannot be created.
enabled = true
backend = auto

; Optional comma/newline-separated narrow paths agents may read in addition
; to the target. Never expose /, a home directory, or unrelated private data.
extra_read_paths =


[budget]

; Calls include openings, counters, repairs, audits, and model adjudication.
; Increase these ceilings deliberately for unusually large tasks.
max_model_calls = 16
max_wall_minutes = 120
max_total_tokens = 250000

; Cost enforcement is disabled until current model-specific rates are supplied.
; Token, call, and wall-time ceilings remain mandatory.
max_estimated_cost_usd = 0
input_usd_per_million = 0
cached_input_usd_per_million = 0
output_usd_per_million = 0


[evidence]

; ACCEPT requires a non-empty, non-disputed structured evidence ledger.
require_for_acceptance = true


[adjudication]

; Agent agreement remains tentative until an independent human approves it.
; Model adjudication requires an explicitly different model.
mode = human
model =
reasoning_effort = high


[output]

; Exact prompts and raw event streams improve reproducibility but can contain
; sensitive project context. Review archives before sharing them.
publish_prompts = true
publish_raw_jsonl = true

; Successful runs are already archived under runs/<run-id>/.
keep_private_runtime_on_success = false

; Interrupted state is the durable resume source and must be retained.
keep_private_runtime_on_failure = true
